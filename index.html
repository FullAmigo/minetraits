        pose: "どこでどの<ruby>素材<rt>そざい</rt></ruby>が<ruby>一番効率<rt>いちばんこうりつ</rt></ruby>よく<ruby>手<rt>て</rt></ruby>に<ruby>入<rt>はい</rt></ruby>るか<ruby>計算<rt>けいさん</rt></ruby>し、チェストの<ruby>中身<rt>なかみ</rt></ruby>を<ruby>完璧<rt>かんぺき</rt></ruby>に<ruby>分類<rt>ぶんるい</rt></ruby>・<ruby>管理<rt>かんり</rt></ruby>する<ruby>人<rt>ひと</rt></ruby>。",
        spec: "<ruby>情報<rt>じょうほう</rt></ruby>のなかからパターンを<ruby>見<rt>み</rt></ruby>つけ、もっとも<ruby>効率的<rt>こうりつてき</rt></ruby>な<ruby>答<rt>こた</rt></ruby>えを<ruby>導<rt>みちび</rt></ruby>き<ruby>出<rt>だ</rt></ruby>す<ruby>力<rt>ちから</rt></ruby>。",
        future: "あふれる<ruby>情報<rt>じょうほう</rt></ruby>のなかから「いま、何をすべきか」を<ruby>論理的<rt>ろんりてき</rt></ruby>に<ruby>判断<rt>はんだん</rt></ruby>できる<ruby>能力<rt>のうりょく</rt></ruby>は、<ruby>意思決定<rt>いしけってい</rt></ruby>の<ruby>鍵<rt>かぎ</rt></ruby>となります。"
    },
    Visionary: {
        title: "ビジョナリー・エバンジェリスト（<ruby>ビジョン<rt>びじょん</rt></ruby><ruby>伝道師<rt>でんどうし</rt></ruby>）",
        pose: "「ここをこんな<ruby>素晴<rt>すば</rt></ruby>らしい<ruby>街<rt>まち</rt></ruby>にしよう！」と<ruby>熱<rt>あつ</rt></ruby>く<ruby>語<rt>かた</rt></ruby>り、<ruby>周囲<rt>しゅうい</rt></ruby>をその<ruby>気<rt>き</rt></ruby>にさせて<ruby>協力者<rt>きょうりょくしゃ</rt></ruby>を<ruby>集<rt>あつ</rt></ruby>める<ruby>人<rt>ひと</rt></ruby>。",
        spec: "<ruby>言葉<rt>ことば</rt></ruby>やイメージで<ruby>未来<rt>みらい</rt></ruby>を<ruby>語<rt>かた</rt></ruby>り、<ruby>人々<rt>ひとびと</rt></ruby>のワクワクを<ruby>引<rt>ひ</rt></ruby>き<ruby>出<rt>だ</rt></ruby>す<ruby>力<rt>ちから</rt></ruby>。",
        future: "<ruby>変化<rt>へんか</rt></ruby>の<ruby>激<rt>hage</rt></ruby>しい<ruby>時代<rt>じだい</rt></ruby>、<ruby>人々<rt>ひとびと</rt></ruby>を<ruby>迷<rt>まよ</rt></ruby>わせず「あっちへ<ruby>行<rt>い</rt></ruby>こう！」と<ruby>指<rt>ゆび</rt></ruby>し<ruby>示<rt>しめ</rt></ruby>す<ruby>言葉<rt>ことば</rt></ruby>の<ruby>力<rt>ちから</rt></ruby>は、リーダーシップの<ruby>本質<rt>ほんしつ</rt></ruby>です。"
    }
};

let currentIdx = 0;
let scores = { Architect: 0, Hacker: 0, Organizer: 0, Quality: 0, Strategist: 0, Visionary: 0 };
let currentResultData = null; // 診断結果を保持するグローバル変数を追加

function startQuiz() {
    questions.sort(() => Math.random() - 0.5);
    document.getElementById("start-screen").style.display = "none";
    document.getElementById("quiz-area").style.display = "block";
    showQuestion();
}

function showQuestion() {
    const q = questions[currentIdx];
    const heartDisplay = document.getElementById("heart-display");
    heartDisplay.innerHTML = ""; // 一旦クリア

    const totalHearts = questions.length;
    const currentHeartCount = currentIdx + 1;

    for (let i = 0; i < totalHearts; i++) {
        const heart = document.createElement("div");
        heart.className = "pixel-heart";
        // 答えた数より後ろのハートは「空（グレー）」にする
        if (i >= currentHeartCount) {
            heart.classList.add("empty");
        }
        heartDisplay.appendChild(heart);
    }

    document.getElementById("question-text").innerHTML = q.text;

    const shuffledOptions = [...q.options];
    shuffledOptions.sort(() => Math.random() - 0.5);

    // 選択肢を描画する処理の例
    const btnArea = document.getElementById("answer-buttons");
    btnArea.innerHTML = ""; // 一旦クリア

    // シャッフルされた選択肢の配列（shuffledOptions）を展開する
    shuffledOptions.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerHTML = opt.text;
        btn.onclick = () => next(opt.type);
        btnArea.appendChild(btn);
})
}

function next(type) {
    scores[type]++;
    currentIdx++;
    if (currentIdx < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz-area").style.display = "none";
    document.getElementById("result-area").style.display = "block";
    
    // 1. 最高スコアの数値を特定
    const maxScore = Math.max(...Object.values(scores));
    
    // 2. 最高スコアを持つタイプをすべて抽出する
    const topTypes = Object.keys(scores).filter(type => scores[type] === maxScore);
    
    // 3. 同点のタイプからランダムに1つ選ぶ
    const topType = topTypes[Math.floor(Math.random() * topTypes.length)];    const res = results[topType];
    
    // グローバル変数に結果データを保存
    currentResultData = res;
    
    document.getElementById("result-title-main").innerHTML = res.title;
    
    const details = document.getElementById("result-details");
    details.innerHTML = `
        <div class="result-item">
            <span class="label">🛠️ マイクラでのあなた</span><br>
            ${res.pose}
        </div>
        <div class="result-item">
            <span class="label">📜 専門性（とくせい）</span><br>
            ${res.spec}
        </div>
        <div class="result-item">
            <span class="label">💎 10年後の価値</span><br>
            ${res.future}
        </div>
    `;
    
    const ctx = document.getElementById('resultChart').getContext('2d');
    new Chart(ctx, {
        type: 'radar',
        data: {
            labels: ['設計', '突破', '組織', '品質', '戦略', 'ビジョン'],
            datasets: [{
                label: '君のステータス',
                data: [scores.Architect, scores.Hacker, scores.Organizer, scores.Quality, scores.Strategist, scores.Visionary],
                backgroundColor: 'rgba(165, 214, 167, 0.6)', 
                borderColor: '#ffffff', 
                pointBackgroundColor: '#ffffff', 
                borderWidth: 3
            }]
        },
        options: {
            scales: {
                r: {
                    angleLines: { color: 'rgba(255, 255, 255, 0.5)' }, 
                    grid: { color: 'rgba(255, 255, 255, 0.5)' }, 
                    pointLabels: {
                        color: '#ffffff', 
                        font: {
                            family: 'DotGothic16',
                            size: 14
                        }
                    },
                    suggestedMin: 0,
                    suggestedMax: 4, 
                    ticks: { display: false, stepSize: 1 }
                }
            },
            plugins: { 
                legend: { display: false } 
            }
        }
    });
}

function shareResult() {
    // 保存したグローバルデータをチェック
    if (!currentResultData) {
        alert("診断結果がありません。");
        return;
    }
    
    // ルビのタグを除去してテキストを取り出す
    let titleHtml = currentResultData.title;
    titleHtml = titleHtml.replace(/<rt>.*?<\/rt>/g, ""); // ふりがな部分を削除
    titleHtml = titleHtml.replace(/<\/?ruby>/g, "");   // rubyタグを削除

    // HTMLタグを除去してテキストを取り出す
    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = titleHtml;
    const typeName = tempDiv.innerText || tempDiv.textContent;
    
    const shareText = `マイクラキャリアビジョン診断の結果、私のタイプは…\n【${typeName}】でした！\n#マイクラキャリアビジョン診断 #フラミーゴ`;
    const shareUrl = window.location.href; 

    スマホのシェア機能またはクリップボードコピー
    if (navigator.share) {
        navigator.share({
            title: '🌳マイクラキャリアビジョン診断⛏️',
            text: shareText,
            url: shareUrl
        }).catch(() => {
            alert("シェアに失敗しました");
        });
    } else {
        const fullText = `${shareText}\n${shareUrl}`;
        navigator.clipboard.writeText(fullText).then(() => {
            alert("結果をクリップボードにコピーしたよ！貼り付けてみんなに教えてね。");
        });
    }
}
